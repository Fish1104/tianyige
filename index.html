<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>天一阁知识图谱</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<script>window.echarts || document.write('<script src="lib/echarts.min.js"><\/script>')</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;background:#0f1923;color:#e0e0e0;overflow:hidden;height:100vh}
#app{display:flex;height:100vh}
#sidebar{width:380px;background:#1a2940;border-right:1px solid #2a3f5a;display:flex;flex-direction:column;z-index:10;flex-shrink:0}
#graph-container{flex:1;position:relative}
#chart{width:100%;height:100%}
#search-box{margin:16px;position:relative}
#search-box input{width:100%;padding:12px 40px 12px 16px;border-radius:8px;border:1px solid #2a3f5a;background:#162231;color:#e0e0e0;font-size:14px;outline:none;transition:all .3s}
#search-box input:focus{border-color:#5b8cc9;box-shadow:0 0 0 3px rgba(91,140,201,0.15)}
#search-box .icon{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:#6a8aab;font-size:16px}
#legend{padding:0 16px 16px;display:flex;flex-wrap:wrap;gap:8px}
#legend .tag{padding:4px 10px;border-radius:12px;font-size:11px;cursor:pointer;transition:all .2s;border:1px solid transparent;user-select:none}
#legend .tag:hover{opacity:.85;transform:scale(1.04)}
.tag-people{background:rgba(230,100,100,0.2);color:#e66464;border-color:rgba(230,100,100,0.35)}
.tag-family{background:rgba(230,170,80,0.2);color:#e6aa50;border-color:rgba(230,170,80,0.35)}
.tag-scholar{background:rgba(100,180,230,0.2);color:#64b4e6;border-color:rgba(100,180,230,0.35)}
.tag-building{background:rgba(80,200,150,0.2);color:#50c896;border-color:rgba(80,200,150,0.35)}
.tag-collection{background:rgba(180,130,230,0.2);color:#b482e6;border-color:rgba(180,130,230,0.35)}
.tag-event{background:rgba(230,200,80,0.2);color:#e6c850;border-color:rgba(230,200,80,0.35)}
.tag-rule{background:rgba(150,180,210,0.2);color:#96b4d2;border-color:rgba(150,180,210,0.35)}
.tag-honor{background:rgba(220,160,200,0.2);color:#dca0c8;border-color:rgba(220,160,200,0.35)}
.tag-book{background:rgba(140,200,180,0.2);color:#8cc8b4;border-color:rgba(140,200,180,0.35)}
.tag.dimmed{opacity:.35}
#detail-panel{flex:1;overflow-y:auto;padding:16px;border-top:1px solid #2a3f5a}
#detail-panel h3{color:#5b8cc9;margin-bottom:8px;font-size:15px}
#detail-panel .meta{margin-bottom:6px;font-size:13px;color:#a0b8d0}
#detail-panel .meta strong{color:#d0d8e0;display:inline-block;min-width:48px}
#detail-panel .desc{margin-top:10px;font-size:13px;color:#b0c0d0;line-height:1.7}
#detail-panel .relations{margin-top:12px}
#detail-panel .relations h4{font-size:13px;color:#7a9ab8;margin-bottom:6px}
#detail-panel .rel-tag{display:inline-block;padding:3px 8px;margin:2px 4px 2px 0;border-radius:10px;font-size:11px;background:rgba(91,140,201,0.15);color:#8ab4d8;cursor:pointer;transition:all .2s}
#detail-panel .rel-tag:hover{background:rgba(91,140,201,0.3)}
#detail-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#4a6a8a;font-size:13px;text-align:center;padding:20px}
#detail-empty .big{font-size:48px;margin-bottom:12px;opacity:.5}
#stats-bar{padding:8px 16px;font-size:12px;color:#5a7a9a;border-bottom:1px solid #2a3f5a;display:flex;justify-content:space-between}
#tooltip-custom{position:fixed;pointer-events:none;background:rgba(20,35,55,0.95);border:1px solid #3a5a7a;border-radius:8px;padding:10px 14px;font-size:12px;color:#d0e0f0;max-width:260px;z-index:100;display:none;backdrop-filter:blur(8px)}
#tooltip-custom .tt-name{font-size:14px;font-weight:bold;color:#fff;margin-bottom:4px}
#tooltip-custom .tt-cat{font-size:11px;margin-bottom:2px}

/* === 汉堡按钮 === */
#hamburger-btn{display:none;position:fixed;top:12px;left:12px;z-index:30;width:44px;height:44px;border-radius:12px;background:rgba(26,41,64,0.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(42,63,90,0.6);color:#e0e0e0;font-size:22px;cursor:pointer;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;box-shadow:0 4px 16px rgba(0,0,0,0.3)}
#hamburger-btn:active{background:rgba(42,63,90,0.9);transform:scale(0.95)}

/* === 遮罩层 === */
#sidebar-overlay{display:none;position:fixed;inset:0;z-index:15;background:rgba(0,0,0,0.5);-webkit-tap-highlight-color:transparent}

/* === 侧边栏关闭按钮 === */
#sidebar-close-btn{display:none;position:absolute;top:12px;right:12px;z-index:5;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);color:#8a9ab0;font-size:18px;cursor:pointer;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
#sidebar-close-btn:active{background:rgba(255,255,255,0.18)}

/* === 移动端底部详情面板 === */
#mobile-detail-overlay{display:none;position:fixed;inset:0;z-index:25;background:rgba(0,0,0,0.5);-webkit-tap-highlight-color:transparent}
#mobile-detail-sheet{display:none;position:fixed;bottom:0;left:0;right:0;z-index:26;background:#1a2940;border-radius:20px 20px 0 0;max-height:70vh;overflow-y:auto;padding:8px 16px 24px;box-shadow:0 -8px 32px rgba(0,0,0,0.5);transform:translateY(100%);transition:transform .35s cubic-bezier(0.32,0.72,0,1)}
#mobile-detail-sheet.open{transform:translateY(0)}
#mobile-detail-sheet .sheet-handle{width:36px;height:4px;background:#4a6a8a;border-radius:2px;margin:8px auto 16px}
#mobile-detail-sheet h3{color:#5b8cc9;margin-bottom:8px;font-size:16px}
#mobile-detail-sheet .meta{margin-bottom:6px;font-size:13px;color:#a0b8d0}
#mobile-detail-sheet .meta strong{color:#d0d8e0;display:inline-block;min-width:48px}
#mobile-detail-sheet .desc{margin-top:10px;font-size:13px;color:#b0c0d0;line-height:1.7}
#mobile-detail-sheet .relations{margin-top:12px}
#mobile-detail-sheet .relations h4{font-size:13px;color:#7a9ab8;margin-bottom:6px}
#mobile-detail-sheet .rel-tag{display:inline-block;padding:4px 10px;margin:3px 5px 3px 0;border-radius:10px;font-size:12px;background:rgba(91,140,201,0.15);color:#8ab4d8;cursor:pointer;-webkit-tap-highlight-color:transparent}
#mobile-detail-sheet .sheet-close-btn{position:absolute;top:14px;right:16px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,0.08);border:none;color:#8a9ab0;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}

/* ====== 移动端响应式 (覆盖微信等报告980px的浏览器) ====== */
@media (max-width: 1024px), (max-device-width: 1024px) {
  #hamburger-btn{display:flex}
  #sidebar{position:fixed;top:0;left:0;bottom:0;width:340px;max-width:85vw;transform:translateX(-100%);box-shadow:4px 0 24px rgba(0,0,0,0.4);transition:transform .3s ease}
  #sidebar.open{transform:translateX(0)}
  #sidebar-close-btn{display:flex}
  #sidebar-overlay.show{display:block}
  #graph-container{flex:1;position:absolute;inset:0}
  #chart{width:100%;height:100%}
  #tooltip-custom{display:none!important}
  #detail-panel{display:none}
  #detail-empty{display:none}
  #search-box input{font-size:15px;padding:12px 40px 12px 14px}
  #legend .tag{font-size:10px;padding:3px 8px}
  #stats-bar{font-size:11px;padding:8px 12px}
}
</style>
</head>
<body>
<div id="app">
<button id="hamburger-btn" aria-label="菜单">&#9776;</button>
<div id="sidebar-overlay"></div>
<div id="sidebar">
<button id="sidebar-close-btn" aria-label="关闭">&#10005;</button>
<div id="search-box">
<input type="text" id="search-input" placeholder="搜索节点（人物、建筑、文物...）" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
<span class="icon">&#x1F50D;</span>
</div>
<div id="stats-bar"><span>节点: <strong id="node-count">0</strong></span><span>关系: <strong id="edge-count">0</strong></span></div>
<div id="legend"></div>
<div id="detail-panel"><div id="detail-empty"><span class="big">&#x1F4DC;</span><p>点击图谱中的节点<br>查看详细信息</p></div></div>
</div>
<div id="graph-container"><div id="chart"></div></div>
</div>
<div id="tooltip-custom"></div>
<div id="mobile-detail-overlay"></div>
<div id="mobile-detail-sheet">
<button class="sheet-close-btn" aria-label="关闭">&#10005;</button>
<div class="sheet-handle"></div>
<div id="mobile-detail-content"></div>
</div>

<script>
// ============ DATA ============
const categories = [
  {name:'核心人物', itemStyle:{color:'#e66464'}, symbol:'circle', symbolSize:28},
  {name:'范氏族人', itemStyle:{color:'#e6aa50'}, symbol:'circle', symbolSize:20},
  {name:'外部学者', itemStyle:{color:'#64b4e6'}, symbol:'diamond', symbolSize:22},
  {name:'建筑', itemStyle:{color:'#50c896'}, symbol:'roundRect', symbolSize:24},
  {name:'馆藏文物', itemStyle:{color:'#b482e6'}, symbol:'triangle', symbolSize:22},
  {name:'历史事件', itemStyle:{color:'#e6c850'}, symbol:'pin', symbolSize:22},
  {name:'制度规约', itemStyle:{color:'#96b4d2'}, symbol:'rect', symbolSize:20},
  {name:'保护荣誉', itemStyle:{color:'#dca0c8'}, symbol:'arrow', symbolSize:20},
  {name:'古籍分类', itemStyle:{color:'#8cc8b4'}, symbol:'diamond', symbolSize:18}
];

const nodes = [
  // === 核心人物 (cat 0) ===
  {id:'fanqin', name:'范钦', cat:0, desc:'字尧卿，号东明（1506-1585），明兵部右侍郎，天一阁创建者。嘉靖十一年进士，宦游全国遍收典籍七万余卷。', detail:'嘉靖三十九年（1560）辞官归鄞，于1561-1566年建成天一阁。制定"代不分书，书不出阁"祖训。著有《东明范公诗文集》《范司马奏议》等。临终分家产为白银万两与全部藏书，命子孙择其一。'},

  // === 范氏族人 (cat 1) ===
  {id:'fandachong', name:'范大冲', cat:1, desc:'范钦长子（1540-1602），放弃万两白银继承天一阁，确立护书根基。', detail:'建立钥匙分房共管制度，立碑禁约"借人为不孝"。持续收购散佚古籍，整理范钦遗留手稿，完善藏书目录。'},
  {id:'fandaqian', name:'范大潜', cat:1, desc:'范钦次子（1544-1585），与范钦同年去世，由其妻代表二房分产。', detail:'二房仅分得田产银钱，无登阁、管书权限。'},
  {id:'fanrunan', name:'范汝楠', cat:1, desc:'范大冲之子（十八世），扩充藏书，完善阁门钥匙共管制度。'},
  {id:'fanguangwen', name:'范光文', cat:1, desc:'十九世，顺治六年进士，清初战乱后全面修缮天一阁与司马第，为清代复兴第一人。'},
  {id:'fantingfu', name:'范廷辅', cat:1, desc:'二十世，守阁。'},
  {id:'fanmaozhu', name:'范懋柱', cat:1, desc:'二十一世，范钦八世孙。乾隆年间献书638种，为全国私人献书之最。', detail:'乾隆赏赐《古今图书集成》一万卷并御笔题诗，天一阁声望达顶峰。但大量孤本被朝廷抄走未归还，藏书首次大规模流失。'},
  {id:'fanyongqi', name:'范永祺', cat:1, desc:'二十二世，乾隆丙午举人，字凤颉，工篆隶印刻，藏明代尺牍甲于东南。'},
  {id:'fanyongcheng', name:'范永澄', cat:1, desc:'二十二世，乾隆三十一年进士，整理范氏家乘，修订《四明范氏宗谱》。'},
  {id:'fanbangsui', name:'范邦绥', cat:1, desc:'二十三世，咸丰六年进士。晚清战乱中保护藏书，修复遭太平军损毁的司马第。'},
  {id:'fanbangdian', name:'范邦甸', cat:1, desc:'二十三世，晚清护书。'},
  {id:'fanduojue', name:'范多珏', cat:1, desc:'二十四世，守阁。'},
  {id:'fanduogui', name:'范多桂', cat:1, desc:'二十四世，守阁。'},
  {id:'fanfengshu', name:'范凤书', cat:1, desc:'二十五世，守阁。'},
  {id:'fanfengqi', name:'范凤岐', cat:1, desc:'二十五世，守阁。'},
  {id:'fanxingzeng', name:'范兴增', cat:1, desc:'二十六世，守阁。'},
  {id:'fansizhu', name:'范嗣柱', cat:1, desc:'二十七世，守阁。'},
  {id:'fanluqi', name:'范鹿其', cat:1, desc:'二十八世，近代最后一代专职护书人。', detail:'民国时期主持天一阁日常看护。1949年配合解放军守护天一阁，后任宁波市古物陈列所主任。'},
  {id:'fanzongyin', name:'范宗尹', cat:1, desc:'迁甬始祖（1100-1136），南宋右仆射，谥忠肃。'},
  {id:'fangonglin', name:'范公麟', cat:1, desc:'范宗尹次子，迁甬一世祖，称"范二房"。'},

  // === 外部学者 (cat 2) ===
  {id:'huangzongxi', name:'黄宗羲', cat:2, desc:'1673年成为外姓登阁第一人，编制书目并撰写《天一阁藏书记》。'},
  {id:'quanzuwang', name:'全祖望', cat:2, desc:'清代浙东学派代表，多次登阁校勘，撰《天一阁藏书记》《宋拓石鼓文跋》。'},
  {id:'fengfang', name:'丰坊', cat:2, desc:'万卷楼主人（1492-1563），范钦忘年交。万卷楼失火后残书及《兰亭序》帖石转入天一阁。'},
  {id:'tulong', name:'屠隆', cat:2, desc:'明代文学家（1543-1605），与范钦互为姻亲、文坛挚友。'},
  {id:'zhangshiche', name:'张时彻', cat:2, desc:'明代官员，范钦姻亲与文坛挚友，互赠藏书。'},
  {id:'xuwwei', name:'徐渭', cat:2, desc:'明代文人（号青藤），常至司马第论书。天一阁藏其《渡海观音图轴》《白燕诗轴》。'},
  {id:'shenmingchen', name:'沈明臣', cat:2, desc:'明代甬上文坛核心人物，常至天一阁论书。'},
  {id:'ruanyuan', name:'阮元', cat:2, desc:'清代学者，多次登阁校勘典籍。'},
  {id:'qiandaxin', name:'钱大昕', cat:2, desc:'清代学者，登阁校勘并为范氏撰写藏书题记。'},
  {id:'qianlong', name:'乾隆皇帝', cat:2, desc:'修《四库全书》时天一阁献书最多，赏赐《古今图书集成》一万卷，御笔题诗。'},
  {id:'malian', name:'马廉', cat:2, desc:'近代藏书家，捐赠晋砖千余枚，天一阁设"千晋斋"陈列。'},
  {id:'liuchengan', name:'刘承幹', cat:2, desc:'近代藏书家，与范鹿其交涉古籍保护事宜。'},
  {id:'xuefucheng', name:'薛福成', cat:2, desc:'清代官员，捐俸禄维修天一阁并编纂《天一阁见存书目》。'},
  {id:'sunxingyan', name:'孙星衍', cat:2, desc:'金石学家，编《寰宇访碑录》，采天一阁拓本204种。'},
  {id:'zhangyuanji', name:'张元济', cat:2, desc:'商务印书馆创始人，民国时期赎回被盗书籍藏于涵芬楼。'},
  {id:'fengjicai', name:'冯骥才', cat:2, desc:'当代作家，曾感慨"天一阁藏书楼该另有一种称呼，叫做天一阁藏画楼了"。'},

  // === 建筑 (cat 3) ===
  {id:'tianyige-main', name:'天一阁（宝书楼）', cat:3, desc:'核心藏书楼，砖木结构硬山顶重楼，通高8.5米，二层通间一层六间，"天一地六"格局。', detail:'建于1561-1566年。阁前凿天一池连通月湖，假山堆"九狮一象"。防火墙隔离，芸草防蛀，英石吸潮。2010年新建恒温恒湿书库。'},
  {id:'zunjingge', name:'尊经阁', cat:3, desc:'原宁波府学建筑，1935年迁入，重檐歇山顶，内藏御赐书籍和儒家经典。'},
  {id:'dongmingcaotang', name:'东明草堂', cat:3, desc:'范钦建阁前藏书处，号"一吾庐"，正门有獬豸浮雕。1980年重建。'},
  {id:'mingzhoubeilin', name:'明州碑林', cat:3, desc:'共173方碑刻，最早为北宋熙宁元年《众乐亭诗刻》，含王安石、司马光等15人诗20首。'},
  {id:'fanshiguju', name:'范氏故居（司马第）', cat:3, desc:'范钦宅第，与藏书楼分离建造，现存建筑建于1829年。1996年修复归入博物馆景区。'},
  {id:'qinshizici', name:'秦氏支祠', cat:3, desc:'1923-1925年建，融合木雕、砖雕、石雕、贴金工艺，戏台穹形藻井精美。'},
  {id:'qianjinzhai', name:'千晋斋', cat:3, desc:'陈列马廉捐赠的晋砖千余枚及历代古砖。'},
  {id:'dongyuan', name:'东园', cat:3, desc:'约6000平方米，含明池、假山、长廊、碑林、百鹅亭、凝晖堂等。'},
  {id:'nanlou', name:'南楼', cat:3, desc:'占地3400平方米，以水北阁为主体。'},
  {id:'tianyichi', name:'天一池', cat:3, desc:'阁前防火水池，连通月湖，假山堆"九狮一象"，兼具防火与园林功能。'},
  {id:'shuhuaguan', name:'书画馆', cat:3, desc:'含云在楼、博雅堂、昼锦堂、画帘堂、状元厅、南轩六栋建筑。'},

  // === 馆藏文物 (cat 4) ===
  {id:'shenlong-lanting', name:'神龙本《兰亭序》帖石', cat:4, desc:'镇馆之宝。丰坊以冯承素摹本勒石，公认存世神龙《兰亭序》传本之冠，所有神龙本刻石"祖本"。'},
  {id:'huangtingjian', name:'黄庭坚《草书竹枝词卷》', cat:4, desc:'镇馆之宝。唯一绢本，52岁书，全卷283字。黄庭坚存世草书墨迹国内外仅七件。'},
  {id:'wuzhen', name:'吴镇《双树坡石图轴》', cat:4, desc:'镇馆之宝。元四家之一吴镇存世以两棵树为中心的作品仅两幅，此为其一。'},
  {id:'hongwu-dengkelu', name:'《洪武四年进士登科录》', cat:4, desc:'镇馆之宝。现存最早登科录实物，收高丽籍进士金涛，2008年入选首批《国家珍贵古籍名录》。'},
  {id:'shiguwen', name:'北宋拓本《石鼓文》', cat:4, desc:'镇馆级碑帖。全祖望称"未入燕京之拓本"，金石家视为"天下乐石最古拓本"。'},

// ============ CHART INIT (包裹load确保DOM尺寸就绪) ============
const chartDom = document.getElementById('chart');
let chart, tooltipDom;
let currentHighlight = null;
let currentData;
let isMobile = false;

function detectMobile() {
  var w = window.innerWidth || document.documentElement.clientWidth;
  var sw = screen.width;
  var hasTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0) || (navigator.msMaxTouchPoints > 0);
  var ua = navigator.userAgent || '';
  var isMobileUA = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile|CriOS/i.test(ua);
  return (w < 1024 || sw < 1024 || hasTouch || isMobileUA);
}

function forceMobileLayout() {
  var sidebar = document.getElementById('sidebar');
  var graphContainer = document.getElementById('graph-container');
  var hamburger = document.getElementById('hamburger-btn');
  var closeBtn = document.getElementById('sidebar-close-btn');

  sidebar.style.position = 'fixed';
  sidebar.style.top = '0';
  sidebar.style.left = '0';
  sidebar.style.bottom = '0';
  sidebar.style.width = '340px';
  sidebar.style.maxWidth = '85vw';
  sidebar.style.transform = 'translateX(-100%)';
  sidebar.style.transition = 'transform 0.3s ease';
  sidebar.style.boxShadow = '4px 0 24px rgba(0,0,0,0.4)';
  sidebar.style.zIndex = '20';

  graphContainer.style.position = 'absolute';
  graphContainer.style.left = '0';
  graphContainer.style.top = '0';
  graphContainer.style.width = '100vw';
  graphContainer.style.height = '100vh';

  hamburger.style.display = 'flex';
  closeBtn.style.display = 'flex';

  document.getElementById('detail-panel').style.display = 'none';
  if (document.getElementById('detail-empty')) document.getElementById('detail-empty').style.display = 'none';
  document.getElementById('tooltip-custom').style.display = 'none';
}

function initAll() {
  isMobile = detectMobile();

  if (isMobile) {
    forceMobileLayout();
  }

  // 显式设置 chart 容器像素尺寸，确保容器不为 0x0
  var vw = window.innerWidth || document.documentElement.clientWidth;
  var vh = window.innerHeight || document.documentElement.clientHeight;
  if (isMobile) {
    chartDom.style.width = vw + 'px';
    chartDom.style.height = vh + 'px';
  }

  chart = echarts.init(chartDom);
  tooltipDom = document.getElementById('tooltip-custom');

  // 初始化后立即 resize 确保尺寸生效
  chart.resize();

  // 移动端节点缩小
  if (isMobile) {
    categories.forEach(function(c) {
      c.symbolSize = Math.round(c.symbolSize * 0.65);
      if (c.symbolSize < 10) c.symbolSize = 10;
    });
  }

  // Build legend
  var legendEl = document.getElementById('legend');
  var catClasses = ['tag-people','tag-family','tag-scholar','tag-building','tag-collection','tag-event','tag-rule','tag-honor','tag-book'];
  categories.forEach(function(c, i) {
    var t = document.createElement('span');
    t.className = 'tag ' + catClasses[i];
    t.textContent = c.name;
    t.onclick = function() { toggleCategory(i, t); };
    t.addEventListener('touchend', function(e) { e.preventDefault(); toggleCategory(i, t); });
    legendEl.appendChild(t);
  });

  currentData = buildGraphData();
  document.getElementById('node-count').textContent = currentData.nodes.length;
  document.getElementById('edge-count').textContent = currentData.links.length;

  var opt = {
    tooltip: {},
    legend: {show: false},
    series: [{
      type: 'graph', layout: 'force', roam: true, draggable: true,
      force: isMobile
        ? {repulsion: 180, gravity: 0.08, edgeLength: [50, 160], layoutAnimation: true}
        : {repulsion: 300, gravity: 0.08, edgeLength: [80, 250], layoutAnimation: true},
      data: currentData.nodes, links: currentData.links,
      categories: categories,
      label: {show: true, position: 'right', fontSize: isMobile ? 9 : 11, color: '#c0d0e0',
        formatter: function(p) { return p.name.length > 7 ? p.name.slice(0, 7) + '...' : p.name; }},
      emphasis: {focus: 'adjacency', lineStyle: {width: 3}, label: {fontSize: isMobile ? 11 : 13, fontWeight: 'bold'}},
      itemStyle: {borderColor: 'rgba(255,255,255,0.2)', borderWidth: 1},
      lineStyle: {color: '#2a4a6a', curveness: 0.15, opacity: 0.6}
    }]
  };
  chart.setOption(opt);

  // === 节点点击 ===
  chart.on('click', function(params) {
    if (params.dataType === 'node') {
      var n = nodes.find(function(x) { return x.id === params.data.id; });
      if (!n) return;
      if (isMobile) {
        showMobileDetail(n);
      } else {
        showDetail(n);
      }
    }
  });

  // === 悬停tooltip ===
  chart.on('mouseover', function(params) {
    if (params.dataType !== 'node' || isMobile) return;
    var n = nodes.find(function(x) { return x.id === params.data.id; });
    if (!n) return;
    var catName = categories[n.cat].name;
    tooltipDom.innerHTML = '<div class="tt-name">' + n.name + '</div><div class="tt-cat" style="color:' + categories[n.cat].itemStyle.color + '">' + catName + '</div><div style="margin-top:6px;line-height:1.5">' + (n.desc || '') + '</div>';
    tooltipDom.style.display = 'block';
  });
  chart.on('mousemove', function(params) {
    if (isMobile) return;
    tooltipDom.style.left = (params.event.event.clientX + 16) + 'px';
    tooltipDom.style.top = (params.event.event.clientY + 16) + 'px';
  });
  chart.on('mouseout', function() { if (!isMobile) tooltipDom.style.display = 'none'; });

  // Search
  var searchInput = document.getElementById('search-input');
  searchInput.addEventListener('input', function() {
    doSearch(this.value.trim().toLowerCase());
  });
  searchInput.addEventListener('keyup', function() {
    doSearch(this.value.trim().toLowerCase());
  });

  // Resize
  window.addEventListener('resize', function() { chart.resize(); });

  // === 移动端汉堡菜单 ===
  setupMobileNav();

  updateChart();

  // === 安全重试：5秒后若节点未渲染则重新初始化 ===
  setTimeout(function() {
    try {
      var model = chart.getModel();
      var seriesList = model.getSeries();
      if (!seriesList || seriesList.length === 0 || !seriesList[0].getData || seriesList[0].getData().count() === 0) {
        chart.dispose();
        chartDom.innerHTML = '';
        chart = echarts.init(chartDom);
        if (isMobile) {
          chartDom.style.width = (window.innerWidth || document.documentElement.clientWidth) + 'px';
          chartDom.style.height = (window.innerHeight || document.documentElement.clientHeight) + 'px';
        }
        chart.setOption(opt);
        chart.resize();
        setupMobileNav();
        updateChart();
      }
    } catch(e2) {
      try {
        chart.dispose();
        chartDom.innerHTML = '';
        chart = echarts.init(chartDom);
        if (isMobile) {
          chartDom.style.width = (window.innerWidth || document.documentElement.clientWidth) + 'px';
          chartDom.style.height = (window.innerHeight || document.documentElement.clientHeight) + 'px';
        }
        chart.setOption(opt);
        chart.resize();
        setupMobileNav();
        updateChart();
      } catch(e3) {}
    }
  }, 5000);
}

function setupMobileNav() {
  var hamburger = document.getElementById('hamburger-btn');
  var sidebar = document.getElementById('sidebar');
  var overlay = document.getElementById('sidebar-overlay');
  var closeBtn = document.getElementById('sidebar-close-btn');

  function openSidebar(e) {
    e.stopPropagation();
    sidebar.classList.add('open');
    overlay.classList.add('show');
    sidebar.style.transform = 'translateX(0)';
  }
  function closeSidebar(e) {
    if (e) e.stopPropagation();
    sidebar.classList.remove('open');
    overlay.classList.remove('show');
    sidebar.style.transform = 'translateX(-100%)';
  }

  hamburger.addEventListener('click', openSidebar);
  hamburger.addEventListener('touchend', function(e) { e.preventDefault(); openSidebar(e); });
  closeBtn.addEventListener('click', closeSidebar);
  closeBtn.addEventListener('touchend', function(e) { e.preventDefault(); closeSidebar(e); });
  overlay.addEventListener('click', closeSidebar);
  overlay.addEventListener('touchend', function(e) { e.preventDefault(); closeSidebar(e); });
}

// === 移动端底部详情面板 ===
function showMobileDetail(n) {
  const sheet = document.getElementById('mobile-detail-sheet');
  const overlay = document.getElementById('mobile-detail-overlay');
  const content = document.getElementById('mobile-detail-content');
  const catName = categories[n.cat].name;
  const catColor = categories[n.cat].itemStyle.color;

  let html = '<h3 style="color:' + catColor + '">' + n.name + '</h3>';
  html += '<div class="meta"><strong>类型：</strong><span style="color:' + catColor + '">' + catName + '</span></div>';
  if (n.desc) html += '<div class="desc">' + n.desc + '</div>';
  if (n.detail) html += '<div class="desc" style="margin-top:8px">' + n.detail + '</div>';
  const related = links.filter(l => l.source === n.id || l.target === n.id);
  if (related.length > 0) {
    html += '<div class="relations"><h4>关联节点（' + related.length + '）</h4>';
    related.forEach(l => {
      const otherId = l.source === n.id ? l.target : l.source;
      const other = nodes.find(x => x.id === otherId);
      if (other) {
        html += '<span class="rel-tag" data-id="' + otherId + '">' + (l.name || '关联') + ' &rarr; ' + other.name + '</span>';
      }
    });
    html += '</div>';
  }
  content.innerHTML = html;

  // 绑定关联节点点击
  content.querySelectorAll('.rel-tag').forEach(el => {
    el.addEventListener('click', function() {
      const tn = nodes.find(x => x.id === this.dataset.id);
      if (tn) showMobileDetail(tn);
    });
    el.addEventListener('touchend', function(e) {
      e.preventDefault();
      const tn = nodes.find(x => x.id === this.dataset.id);
      if (tn) showMobileDetail(tn);
    });
  });

  sheet.style.display = 'block';
  overlay.style.display = 'block';
  // 强制回流后触发动画
  sheet.offsetHeight;
  sheet.classList.add('open');
  overlay.classList.add('show');
}

function closeMobileDetail() {
  const sheet = document.getElementById('mobile-detail-sheet');
  const overlay = document.getElementById('mobile-detail-overlay');
  sheet.classList.remove('open');
  overlay.classList.remove('show');
  setTimeout(function() {
    sheet.style.display = 'none';
    overlay.style.display = 'none';
  }, 350);
}

// 底部面板关闭：按钮 + 遮罩 + 下拉手势
(function() {
  const closeBtn = document.querySelector('#mobile-detail-sheet .sheet-close-btn');
  const overlay = document.getElementById('mobile-detail-overlay');
  const sheet = document.getElementById('mobile-detail-sheet');
  closeBtn.addEventListener('click', closeMobileDetail);
  closeBtn.addEventListener('touchend', function(e) { e.preventDefault(); closeMobileDetail(); });
  overlay.addEventListener('click', closeMobileDetail);
  overlay.addEventListener('touchend', function(e) { e.preventDefault(); closeMobileDetail(); });

  let startY = 0;
  sheet.addEventListener('touchstart', function(e) {
    startY = e.touches[0].clientY;
  }, {passive: true});
  sheet.addEventListener('touchmove', function(e) {
    const dy = e.touches[0].clientY - startY;
    if (dy > 60) {
      closeMobileDetail();
    }
  }, {passive: true});
})();

// ============ 数据函数 ============
let dimmedCats = new Set();
function toggleCategory(idx, el) {
  if (dimmedCats.has(idx)) { dimmedCats.delete(idx); el.classList.remove('dimmed'); }
  else { dimmedCats.add(idx); el.classList.add('dimmed'); }
  updateChart();
}

function buildGraphData() {
  const ns = nodes.map(n => {
    const style = dimmedCats.has(n.cat)
      ? {opacity: 0.12, itemStyle: {color: '#333'}, label: {show: false}}
      : {};
    return Object.assign({
      id: n.id, name: n.name, category: n.cat,
      symbolSize: categories[n.cat].symbolSize,
      symbol: categories[n.cat].symbol,
      _desc: n.desc, _detail: n.detail, _catName: categories[n.cat].name
    }, style.itemStyle ? {itemStyle: style.itemStyle} : {}, style);
  });
  const ls = links.map(l => ({
    source: l.source, target: l.target, label: {show: true, formatter: l.name, fontSize: 10, color: '#7a9ab8'},
    lineStyle: {color: '#3a5a7a', width: 1, opacity: 0.7, curveness: 0.15}
  }));
  return {nodes: ns, links: ls};
}

// ============ 详情面板（桌面端） ============
function showDetail(n) {
  const panel = document.getElementById('detail-panel');
  const catName = categories[n.cat].name;
  const catColor = categories[n.cat].itemStyle.color;
  let html = '<h3 style="color:' + catColor + '">' + n.name + '</h3>';
  html += '<div class="meta"><strong>类型：</strong><span style="color:' + catColor + '">' + catName + '</span></div>';
  if (n.desc) html += '<div class="desc">' + n.desc + '</div>';
  if (n.detail) html += '<div class="desc" style="margin-top:8px">' + n.detail + '</div>';
  const related = links.filter(l => l.source === n.id || l.target === n.id);
  if (related.length > 0) {
    html += '<div class="relations"><h4>关联节点（' + related.length + '）</h4>';
    related.forEach(l => {
      const otherId = l.source === n.id ? l.target : l.source;
      const other = nodes.find(x => x.id === otherId);
      if (other) {
        html += '<span class="rel-tag" data-id="' + otherId + '" style="cursor:pointer">' + (l.name || '关联') + ' &rarr; ' + other.name + '</span>';
      }
    });
    html += '</div>';
  }
  panel.innerHTML = html;
  panel.querySelectorAll('.rel-tag').forEach(el => {
    el.onclick = function() {
      const tn = nodes.find(x => x.id === this.dataset.id);
      if (tn) showDetail(tn);
    };
  });
}

// ============ 搜索 ============
function doSearch(q) {
  if (!q) { resetHighlight(); return; }
  const matched = nodes.filter(n => n.name.toLowerCase().includes(q) || (n.desc || '').toLowerCase().includes(q));
  highlightNodes(matched.map(n => n.id));
}

function highlightNodes(ids) {
  const set = new Set(ids);
  const ns = currentData.nodes.map(n => {
    if (set.has(n.id)) return Object.assign({}, n);
    return Object.assign({}, n, {itemStyle: Object.assign({}, n.itemStyle, {opacity: 0.15}), label: {show: false}});
  });
  const ls = currentData.links.map(l => {
    if (set.has(l.source) && set.has(l.target))
      return Object.assign({}, l, {lineStyle: Object.assign({}, l.lineStyle, {color: '#5b8cc9', width: 2, opacity: 0.9})});
    return Object.assign({}, l, {lineStyle: Object.assign({}, l.lineStyle, {opacity: 0.08})});
  });
  chart.setOption({series: [{data: ns, links: ls}]});
}

function resetHighlight() {
  chart.setOption({series: [{data: currentData.nodes, links: currentData.links}]});
}

function updateChart() {
  currentData = buildGraphData();
  document.getElementById('node-count').textContent = currentData.nodes.filter(n => !dimmedCats.has(n.category)).length;
  chart.setOption({series: [{data: currentData.nodes, links: currentData.links}]});
  resetHighlight();
}

// ============ 启动 ============
window.addEventListener('load', function() { initAll(); });
</script>
